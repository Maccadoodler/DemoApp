spring.application.name=averages

# ===== H2 Database Configuration =====
spring.datasource.url=jdbc:h2:mem:timingdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable the H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.root=INFO

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=myserver

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://trial-3595923.okta.com/oauth2/default